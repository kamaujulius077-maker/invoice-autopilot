<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>ReCollect AI - Automated Payment & Invoice Collection Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#070913',
                        navy: '#0d1424',
                        violetAccent: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' },
                        neonCyan: '#22d3ee',
                        emeraldAccent: '#10b981'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="min-h-screen flex flex-col relative overflow-x-hidden selection:bg-violet-600 selection:text-white">

    <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- HEADER - PASTE YOUR HEADER HERE -->
    <header class="sticky top-0 z-50 glass-panel border-b border-violet-900/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-700 via-purple-600 to-cyan-400 p-0.5 shadow-lg glow-violet">
                        <div class="w-full h-full bg-obsidian rounded-[10px] flex items-center justify-center">
                            <i class="fa-solid fa-bolt text-violet-400 text-lg"></i>
                        </div>
                    </div>
                    <div>
                        <span
                            class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-violet-200 to-cyan-300 bg-clip-text text-transparent">ReCollect<span
                                class="text-violet-500">.AI</span></span>
                        <span class="block text-[10px] font-mono tracking-widest text-cyan-400 uppercase">Auto Debt
                            Recovery</span>
                    </div>
                </div>
                <nav class="hidden md:flex items-center gap-1 bg-navy/80 p-1.5 rounded-2xl border border-violet-900/30">
                    <button onclick="navigateTo('home')" id="nav-home"
                        class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-violet-300 bg-violet-950/60 border border-violet-500/30"><i
                            class="fa-solid fa-house mr-2 text-xs"></i>Home</button>
                    <button onclick="navigateTo('features')" id="nav-features"
                        class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/50"><i
                            class="fa-solid fa-diagram-project mr-2 text-xs"></i>Workflow</button>
                    <button onclick="navigateTo('pricing')" id="nav-pricing"
                        class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/50"><i
                            class="fa-solid fa-calculator mr-2 text-xs"></i>Pricing & ROI</button>
                    <button onclick="navigateTo('dashboard')" id="nav-dashboard"
                        class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/50"><i
                            class="fa-solid fa-chart-line mr-2 text-xs"></i>Live Dashboard</button>
                    <button onclick="navigateTo('api')" id="nav-api"
                        class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/50"><i
                            class="fa-solid fa-code mr-2 text-xs"></i>API Docs</button>
                </nav>
                <div class="flex items-center gap-3">
                    <button onclick="navigateTo('dashboard')"
                        class="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-xs uppercase tracking-wider bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow-lg glow-violet transition-all"><i
                            class="fa-solid fa-play text-cyan-300"></i> Open Demo App</button>
                    <button onclick="toggleMobileMenu()"
                        class="md:hidden p-2.5 rounded-xl bg-navy border border-violet-900/40 text-slate-300"><i
                            class="fa-solid fa-bars text-lg"></i></button>
                </div>
            </div>
        </div>
        <div id="mobileMenu" class="hidden md:hidden border-t border-violet-900/30 bg-obsidian/95 px-4 py-4 space-y-2">
            <button onclick="navigateTo('home')"
                class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-violet-950/40">Home</button>
            <button onclick="navigateTo('features')"
                class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-violet-950/40">Workflow
                & Features</button>
            <button onclick="navigateTo('pricing')"
                class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-violet-950/40">Pricing
                & ROI Calculator</button>
            <button onclick="navigateTo('dashboard')"
                class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-violet-950/40">Live
                Dashboard Simulator</button>
            <button onclick="navigateTo('api')"
                class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-violet-950/40">API
                & Developer Docs</button>
        </div>
    </header>

    <main class="flex-1 relative z-10">
        <!-- PASTE ALL YOUR PAGE SECTIONS HERE (page-home, page-features, etc) -->
        <!-- I kept your hero section - continue with your dashboard etc -->
    </main>

    <script src="app.js"></script>
    <script src="./js/dashboard.js"></script>
</body>

</html>
